<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalCraft Studio | معرض المشاريع</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #30363d;
        }

        header h1 {
            color: #58a6ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            color: #8b949e;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
        }

        .card h3 {
            color: #f0f6fc;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .card p {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .btn {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        .tag {
            background-color: #21262d;
            color: #58a6ff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            border: 1px solid #30363d;
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: #8b949e;
            margin: 40px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DigitalCraft Studio</h1>
            <p>معرض المشاريع الرقمية والحلول البرمجية</p>
        </header>

        <div id="loading">جاري تحميل مشاريعك من GitHub... 🚀</div>
        
        <div class="projects-grid" id="projects-container"></div>
    </div>

    <script>
        // اسم حسابك في GitHub
        const githubUsername = 'mouaad5555';

        async function fetchGitHubProjects() {
            const container = document.getElementById('projects-container');
            const loading = document.getElementById('loading');

            try {
                // جلب المشاريع مرتبة حسب التحديث الأخير
                const response = await fetch(`https://api.github.com/users/${githubUsername}/repos?sort=updated`);
                const repos = await response.json();

                loading.style.display = 'none';

                repos.forEach(repo => {
                    if (!repo.fork) {
                        const card = document.createElement('div');
                        card.className = 'card';

                        card.innerHTML = `
                            <div>
                                <h3>${repo.name}</h3>
                                <p>${repo.description ? repo.description : 'مشروع برمجي متميز ضمن منصة DigitalCraft Studio.'}</p>
                            </div>
                            <div class="card-footer">
                                <span class="tag">${repo.language || 'Code'}</span>
                                <a href="${repo.html_url}" target="_blank" class="btn">عرض المشروع 🔗</a>
                            </div>
                        `;

                        container.appendChild(card);
                    }
                });
            } catch (error) {
                loading.innerText = 'حدث خطأ أثناء تحميل المشاريع.';
                console.error(error);
            }
        }

        fetchGitHubProjects();
    </script>
</body>
</html>
