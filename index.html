<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITAL CRAFT STUDIO | المعرض البرمجي</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0714;
            --card-bg: rgba(25, 16, 38, 0.6);
            --accent-purple: #9d4edd;
            --light-purple: #c77dff;
            --glow: #7b2cbf;
            --text-color: #e0aaff;
            --text-dim: #a39ba8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(123, 44, 191, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(199, 125, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #ffffff, var(--light-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-color);
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .contact-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .contact-item {
            color: var(--light-purple);
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(157, 78, 221, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(199, 125, 255, 0.2);
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 15px var(--glow);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(199, 125, 255, 0.15);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-purple), var(--light-purple));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(199, 125, 255, 0.4);
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card h3 {
            color: #ffffff;
            font-size: 1.4rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h3 i {
            color: var(--light-purple);
        }

        .card p {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .tag {
            background: rgba(157, 78, 221, 0.2);
            color: var(--light-purple);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid rgba(199, 125, 255, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, var(--glow), var(--accent-purple));
            color: white;
            padding: 8px 18px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
        }

        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px var(--accent-purple);
        }

        #loading {
            text-align: center;
            font-size: 1.3rem;
            color: var(--light-purple);
            margin: 50px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DIGITAL CRAFT STUDIO</h1>
            <p>تطوير الحلول البرمجية والمواقع الإلكترونية الاحترافية</p>
            <div class="contact-bar">
                <a href="https://instagram.com/digital.craft_studio" target="_blank" class="contact-item"><i class="fab fontawesome-free"></i> @digital.craft_studio</a>
                <span class="contact-item"><i class="fab fa-whatsapp"></i> +213 784 425 864</span>
                <span class="contact-item"><i class="fab fa-whatsapp"></i> +213 562 01 44 65</span>
            </div>
        </header>

        <div id="loading"><i class="fas fa-spinner fa-spin"></i> جاري استدعاء المشاريع البرمجية...</div>
        
        <div class="projects-grid" id="projects-container"></div>
    </div>

    <script>
        const githubUsername = 'mouaad5555';

        async function fetchGitHubProjects() {
            const container = document.getElementById('projects-container');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch(`https://api.github.com/users/${githubUsername}/repos?sort=updated`);
                const repos = await response.json();

                loading.style.display = 'none';

                repos.forEach(repo => {
                    if (!repo.fork) {
                        const card = document.createElement('div');
                        card.className = 'card';

                        card.innerHTML = `
                            <div>
                                <h3><i class="fas fa-code-branch"></i> ${repo.name}</h3>
                                <p>${repo.description ? repo.description : 'مشروع برمجي متكامل تم تطويره بأسلوب احترافي ضمن خدمات DigitalCraft Studio.'}</p>
                            </div>
                            <div class="card-footer">
                                <span class="tag">${repo.language || 'Code'}</span>
                                <a href="${repo.html_url}" target="_blank" class="btn">معاينة <i class="fas fa-external-link-alt"></i></a>
                            </div>
                        `;

                        container.appendChild(card);
                    }
                });
            } catch (error) {
                loading.innerHTML = 'حدث خطأ أثناء اتصال الشبكة.';
            }
        }

        fetchGitHubProjects();
    </script>
</body>
</html>
